<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>928GT Rev-Match Assist</title>
<style>
  :root {
    --bg: #0a0a0c;
    --amber: #ff9e00;
    --green: #00e676;
    --red: #ff3d00;
    --cyan: #00b0ff;
    --text: #f0f0f5;
    --text-dim: #888895;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, monospace; }
  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding: 8px 12px;
    user-select: none;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 36px;
    margin-bottom: 6px;
  }
  .title { font-size: 0.95rem; font-weight: 700; color: var(--amber); letter-spacing: 1px; }
  select, button {
    background: #191a1f;
    color: var(--text);
    border: 1px solid #494047;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  button.primary {
    background: var(--amber);
    color: #000;
    font-weight: 700;
    border: none;
  }
  button.active {
    background: var(--green);
    color: #000;
    font-weight: 700;
    border: none;
  }
  .controls-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  .controls-bar button { flex: 1; padding: 8px; font-size: 0.85rem; cursor: pointer; }
  .dashboard {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(4px, 1.5vw, 18px);
    align-items: center;
    max-width: 1120px;
    margin: 0 auto;
  }
  .dial-card {
    min-width: 0;
    filter: drop-shadow(0 8px 18px #000);
  }
  .dial-face {
    display: block;
    width: 100%;
    height: auto;
    max-height: min(66vh, 390px);
    max-height: min(66dvh, 390px);
    overflow: visible;
  }
  .dial-bg { fill: url(#dialGradient); stroke: #70635d; stroke-width: 2; }
  .dial-ring { fill: none; stroke: #342d2a; stroke-width: 12; }
  .dial-arc { fill: none; stroke: #b7a18e; stroke-width: 2; }
  .dial-tick { stroke: #d3b6a0; stroke-width: 1.5; }
  .dial-tick.major { stroke-width: 2.4; }
  .dial-tick.redline { stroke: var(--red); }
  .dial-number { fill: #e2c6ac; font-weight: 700; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
  .dial-title { fill: #bba995; font-weight: 700; font-size: 9px; letter-spacing: 2px; text-anchor: middle; }
  .digital-main { fill: #ff785e; font-weight: 800; font-size: 32px; text-anchor: middle; dominant-baseline: middle; font-variant-numeric: tabular-nums; }
  .digital-unit { fill: #c5a58e; font-size: 9px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
  .digital-status { fill: #68d6a0; font-size: 8px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
  .digital-rpm { fill: #d4b8a2; font-size: 10px; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .needle { stroke: #f06c58; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 3px #f06c5870); }
  .needle-tail { stroke: #aa483c; stroke-width: 3; stroke-linecap: round; }
  .needle-hub { fill: #c6b5a7; stroke: #4a3c35; stroke-width: 3; }
  .target-mark { stroke-width: 3; }
  .target-label { font-size: 8px; font-weight: 800; text-anchor: middle; paint-order: stroke; stroke: #17191c; stroke-width: 3px; stroke-linejoin: round; }
  .target-step1 { stroke: var(--green); fill: var(--green); }
  .target-step2 { stroke: var(--cyan); fill: var(--cyan); }
  .target-overrev { stroke: var(--red); fill: var(--red); }
  .target-label.target-step1, .target-label.target-step2, .target-label.target-overrev { stroke: #17191c; }
  .debug-bar { font-size: 0.65rem; color: var(--text-dim); text-align: right; }
  details {
    max-width: 1120px;
    margin: 0 auto;
    padding: 8px;
    background: #141418;
    border: 1px solid #342f31;
    border-radius: 8px;
    font-size: 0.8rem;
  }
  summary { font-weight: 700; color: var(--cyan); cursor: pointer; }
  .sim-controls { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row input[type="range"] { flex: 1; }
  @media (orientation: landscape) {
    body { display: flex; flex-direction: column; }
    .dashboard {
      flex: 1;
      min-height: 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .dashboard .dial-card:nth-child(1) { order: 1; }
    .dashboard .dial-card:nth-child(2) { order: 2; }
    .dial-face { max-height: min(68vh, 440px); max-height: min(68dvh, 440px); }
  }
  @media (max-height: 430px) and (orientation: landscape) {
    body { padding: 4px 10px; }
    header { min-height: 28px; margin-bottom: 2px; }
    .title { font-size: 0.8rem; }
    .controls-bar { margin-bottom: 0; }
    .controls-bar button { padding: 5px; font-size: 0.75rem; }
    .dial-face { max-height: calc(100dvh - 128px); }
    details { padding: 5px 8px; }
  }
  @media (orientation: portrait) {
    .dashboard {
      grid-template-columns: 1fr;
      max-width: min(92vw, 430px);
    }
    .dashboard .dial-card:nth-child(1) { order: 2; }
    .dashboard .dial-card:nth-child(2) { order: 1; }
    .dial-face {
      width: 100%;
      max-height: min(43dvh, 340px);
    }
  }
</style>
</head>
<body>

<header>
  <div class="title">928 GT · REV-MATCH</div>
  <select id="carProfile">
    <option value="928gt">91 Porsche 928 GT (5MT/V8)</option>
    <option value="nd5rc">Mazda Roadster ND (6MT/L4)</option>
  </select>
</header>

<div class="controls-bar">
  <button id="btnStart" class="primary">マイク＆GPS計測開始</button>
  <button id="btnBeep">ガイド音: ON</button>
  <button id="btnScreen">全画面・画面ON</button>
</div>

<div class="dashboard">
  <section class="dial-card" aria-label="速度計">
    <svg class="dial-face" id="speedDial" viewBox="0 0 320 270" role="img" aria-labelledby="speedTitle">
      <defs><radialGradient id="dialGradient" cx="50%" cy="45%" r="65%">
        <stop offset="0" stop-color="#343337"/><stop offset="0.72" stop-color="#202125"/><stop offset="1" stop-color="#111216"/>
      </radialGradient></defs>
      <path class="dial-bg" d="M 68 267 A 130 130 0 1 1 252 267 Z"/>
      <path class="dial-ring" d="M 68 267 A 130 130 0 1 1 252 267"/>
      <path class="dial-arc" d="M 68 267 A 130 130 0 1 1 252 267"/>
      <g id="speedScale"></g>
      <text class="dial-title" id="speedTitle" x="160" y="24">VDO · KM/H</text>
      <line class="needle-tail" id="speedNeedleTail" x1="160" y1="175" x2="160" y2="202"/>
      <line class="needle" id="speedNeedle" x1="160" y1="175" x2="160" y2="70"/>
      <text class="digital-main" id="dispSpeed" x="160" y="143">0</text>
      <text class="digital-unit" id="speedSource" x="160" y="161">KM/H · GPS</text>
      <circle class="needle-hub" cx="160" cy="175" r="8"/>
    </svg>
  </section>
  <section class="dial-card" aria-label="タコメーターとシフトダウン目標回転数">
    <svg class="dial-face" id="tachDial" viewBox="0 0 320 270" role="img" aria-labelledby="tachTitle">
      <path class="dial-bg" d="M 68 267 A 130 130 0 1 1 252 267 Z"/>
      <path class="dial-ring" d="M 68 267 A 130 130 0 1 1 252 267"/>
      <path class="dial-arc" d="M 68 267 A 130 130 0 1 1 252 267"/>
      <g id="tachScale"></g>
      <g id="targetMarkers">
        <g id="targetStep1" style="visibility:hidden">
          <line class="target-mark" x1="160" y1="40" x2="160" y2="53"/>
          <text class="target-label" x="160" y="83"></text>
        </g>
        <g id="targetStep2" style="visibility:hidden">
          <line class="target-mark" x1="160" y1="40" x2="160" y2="53"/>
          <text class="target-label" x="160" y="83"></text>
        </g>
      </g>
      <text class="dial-title" id="tachTitle" x="160" y="24">1/MIN × 1000</text>
      <line class="needle-tail" id="tachNeedleTail" x1="160" y1="175" x2="160" y2="202"/>
      <line class="needle" id="tachNeedle" x1="160" y1="175" x2="160" y2="70"/>
      <text class="digital-main" id="dispGear" x="160" y="139">N</text>
      <text class="digital-status" id="dispGearStatus" x="160" y="157">STANDBY</text>
      <circle class="needle-hub" cx="160" cy="175" r="8"/>
      <text class="digital-rpm" id="dispRpm" x="160" y="224">0 RPM</text>
    </svg>
  </section>
</div>

<details>
  <summary>検証用：仮想速度フック＆テストベンチ連携</summary>
  <div class="sim-controls">
    <label><input type="checkbox" id="chkSimSpeed"> 仮想速度で上書きする（机上テスト用）</label>
    <div class="slider-row">
      <span>仮想車速:</span>
      <input type="range" id="sliderSpeed" min="0" max="160" value="75">
      <span id="valSliderSpeed" style="width:65px; text-align:right;">75 km/h</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button id="btnAutoDecel" style="flex:1;">自動減速ループ (90→40km/h)</button>
    </div>
    <div style="font-size:0.75rem; color:var(--text-dim);">
      ※同ブラウザの別タブで simulator.html を開くと速度が自動同期されます。
    </div>
  </div>
</details>

<div class="debug-bar" id="debugInfo">Ignition: -- Hz | N/V Ratio: --</div>

<script>
// === 車種プロファイル定義 ===
const PROFILES = {
  "928gt": {
    name: "1991 Porsche 928 GT (5.0L V8 / 5MT)",
    cylinders: 8, // 4スト8気筒 = 1回転4爆発 -> RPM = Hz * 15
    redline: 6800,
    // 1〜5速の RPM / (km/h) 比率（ファイナル2.73, 245/45ZR16基準）
    gearRatios: [87.07, 58.20, 42.26, 31.87, 23.09]
  },
  "nd5rc": {
    name: "Mazda Roadster ND (1.5L L4 / 6MT)",
    cylinders: 4, // 4スト4気筒 = 1回転2爆発 -> RPM = Hz * 30
    redline: 7500,
    gearRatios: [115.2, 69.5, 48.8, 37.6, 29.8, 24.5]
  }
};

let currentProfile = PROFILES["928gt"];
let isRunning = false;
let beepEnabled = true;
let screenWakeLock = null;

// Audio / FFT
let audioCtx, analyser, freqData;
let smoothedRpm = 0;

// Speed
let gpsSpeedKmh = 0;
let currentSpeedKmh = 0;

// Gear & Shift State Machine
let engagedGear = null;     // 現在噛み合っているギア (1..N)
let referenceGear = null;   // 直前まで入っていた基準ギア（クラッチ切断中も保持）
let gearStableFrames = 0;
let candidateGear = null;
let isClutchOpen = false;
let targetHitTriggered = false;

// BroadcastChannel (simulator.html の仮想速度連携用)
const simChannel = new BroadcastChannel('928gt_sim_bus');
simChannel.onmessage = (e) => {
  if (e.data && e.data.type === 'SIM_SPEED') {
    document.getElementById('chkSimSpeed').checked = true;
    document.getElementById('sliderSpeed').value = Math.round(e.data.speedKmh);
    document.getElementById('valSliderSpeed').textContent = `${Math.round(e.data.speedKmh)} km/h`;
  }
};

const SVG_NS = 'http://www.w3.org/2000/svg';
const DIAL_CENTER_X = 160;
const DIAL_CENTER_Y = 175;
const DIAL_RADIUS = 130;
const MAX_SPEED_KMH = 300;
const MAX_RPM = 8000;

function buildDialScale(groupId, max, majorStep, minorStep, format, redline = Infinity) {
  const group = document.getElementById(groupId);
  for (let value = 0; value <= max; value += minorStep) {
    const angle = (135 + value / max * 270) * Math.PI / 180;
    const major = value % majorStep === 0;
    const innerRadius = major ? 116 : 122;
    const x1 = DIAL_CENTER_X + Math.cos(angle) * innerRadius;
    const y1 = DIAL_CENTER_Y + Math.sin(angle) * innerRadius;
    const x2 = DIAL_CENTER_X + Math.cos(angle) * DIAL_RADIUS;
    const y2 = DIAL_CENTER_Y + Math.sin(angle) * DIAL_RADIUS;
    const tick = document.createElementNS(SVG_NS, 'line');
    tick.setAttribute('x1', x1);
    tick.setAttribute('y1', y1);
    tick.setAttribute('x2', x2);
    tick.setAttribute('y2', y2);
    tick.setAttribute('class', `dial-tick${major ? ' major' : ''}${value >= redline ? ' redline' : ''}`);
    group.appendChild(tick);

    if (major) {
      const label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('x', DIAL_CENTER_X + Math.cos(angle) * 101);
      label.setAttribute('y', DIAL_CENTER_Y + Math.sin(angle) * 101);
      label.setAttribute('class', 'dial-number');
      label.textContent = format(value);
      group.appendChild(label);
    }
  }
}

buildDialScale('speedScale', MAX_SPEED_KMH, 20, 10, value => value);
buildDialScale('tachScale', MAX_RPM, 1000, 250, value => value / 1000, currentProfile.redline);
setNeedle('speedNeedle', 0, MAX_SPEED_KMH);
setNeedle('tachNeedle', 0, MAX_RPM);

// === UIイベント ===
document.getElementById('carProfile').addEventListener('change', (e) => {
  currentProfile = PROFILES[e.target.value];
  smoothedRpm = 0;
  engagedGear = null;
  referenceGear = null;
  document.getElementById('tachScale').replaceChildren();
  buildDialScale('tachScale', MAX_RPM, 1000, 250, value => value / 1000, currentProfile.redline);
});

document.getElementById('btnBeep').addEventListener('click', (e) => {
  beepEnabled = !beepEnabled;
  e.target.textContent = `ガイド音: ${beepEnabled ? 'ON' : 'OFF'}`;
});

let screenModeActive = false;

async function acquireScreenWakeLock() {
  if (!('wakeLock' in navigator)) {
    document.getElementById('btnScreen').textContent = '全画面・画面ON (Wake Lock非対応)';
    return;
  }
  try {
    screenWakeLock = await navigator.wakeLock.request('screen');
    screenWakeLock.addEventListener('release', () => {
      screenWakeLock = null;
    });
  } catch (err) {
    console.warn('Screen Wake Lock:', err);
  }
}

async function toggleScreenMode() {
  const btn = document.getElementById('btnScreen');

  if (screenModeActive) {
    screenModeActive = false;
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.exitFullscreen) {
      await document.exitFullscreen();
    }
    if (screenWakeLock) {
      await screenWakeLock.release();
    }
    btn.classList.remove('active');
    btn.textContent = '全画面・画面ON';
    return;
  }

  screenModeActive = true;
  const root = document.documentElement;
  try {
    if (root.requestFullscreen) {
      await root.requestFullscreen();
    } else if (root.webkitRequestFullscreen) {
      await root.webkitRequestFullscreen();
    }
  } catch (err) {
    console.warn('Fullscreen:', err);
  }
  await acquireScreenWakeLock();
  btn.classList.add('active');
  btn.textContent = screenWakeLock ? '全画面・画面ON: 有効' : btn.textContent;
}

document.getElementById('btnScreen').addEventListener('click', toggleScreenMode);

document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('btnScreen');
  if (!document.fullscreenElement) {
    if (screenModeActive) btn.textContent = screenWakeLock ? '全画面・画面ON: 有効' : '全画面・画面ON';
  }
});
document.addEventListener('webkitfullscreenchange', () => {
  const btn = document.getElementById('btnScreen');
  if (!document.webkitFullscreenElement) {
    if (screenModeActive) btn.textContent = screenWakeLock ? '全画面・画面ON: 有効' : '全画面・画面ON';
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && screenModeActive && !screenWakeLock) {
    acquireScreenWakeLock();
  }
});

document.getElementById('sliderSpeed').addEventListener('input', (e) => {
  document.getElementById('valSliderSpeed').textContent = `${e.target.value} km/h`;
});

let autoDecelTimer = null;
document.getElementById('btnAutoDecel').addEventListener('click', (e) => {
  if (autoDecelTimer) {
    clearInterval(autoDecelTimer);
    autoDecelTimer = null;
    e.target.classList.remove('active');
    return;
  }
  document.getElementById('chkSimSpeed').checked = true;
  e.target.classList.add('active');
  let simV = 95;
  autoDecelTimer = setInterval(() => {
    simV -= 0.4; // 約 -1.1 m/s^2 の穏やかなブレーキング
    if (simV < 35) simV = 95;
    document.getElementById('sliderSpeed').value = Math.round(simV);
    document.getElementById('valSliderSpeed').textContent = `${Math.round(simV)} km/h`;
  }, 100);
});

// === センサー＆マイク初期化 ===
document.getElementById('btnStart').addEventListener('click', async () => {
  if (isRunning) return;
  try {
    // 1. マイク初期化（ノイズ抑制やAGCをOFFにして生のエンジン音を拾う）
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 8192;
    analyser.smoothingTimeConstant = 0.5;
    source.connect(analyser);
    freqData = new Float32Array(analyser.frequencyBinCount);

    // 2. GPS初期化
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition((pos) => {
        if (pos.coords.speed !== null && !isNaN(pos.coords.speed)) {
          gpsSpeedKmh = pos.coords.speed * 3.6;
        }
      }, (err) => console.warn('GPS:', err), {
        enableHighAccuracy: true,
        maximumAge: 0
      });
    }

    isRunning = true;
    const btn = document.getElementById('btnStart');
    btn.textContent = '計測中 (ACTIVE)';
    btn.classList.add('active');
    requestAnimationFrame(mainLoop);
  } catch (err) {
    alert('マイクの起動に失敗しました。HTTPS環境でアクセスしているか確認してください。\n' + err.message);
  }
});

// === ガイド音（ターゲット到達時の短いビープ） ===
function playTargetBeep() {
  if (!beepEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(980, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.06);
}

// === FFT調波スコア検出（放物線補間） ===
function detectEngineRpm() {
  analyser.getFloatFrequencyData(freqData);
  const sampleRate = audioCtx.sampleRate;
  const binWidth = sampleRate / analyser.fftSize;

  // 4ストロークの点火周波数: Hz = RPM * (cyl / 120)
  const hzToRpm = 120 / currentProfile.cylinders;
  const minRpm = 600;
  const maxRpm = currentProfile.redline + 500;
  const rpmStep = 10;
  const engineOrders = [1, 2, 4, 8];
  const scores = [];
  let bestScore = -Infinity;
  let bestIndex = -1;

  for (let rpm = minRpm; rpm <= maxRpm; rpm += rpmStep) {
    let score = 0;
    let hasSignal = false;

    // クランク回転周波数の1/2/4/8次成分を調べ、調波が揃う候補を優先する
    for (const order of engineOrders) {
      const bin = (rpm * order / 60) / binWidth;
      const lowerBin = Math.floor(bin);
      const upperBin = Math.min(freqData.length - 1, lowerBin + 1);
      const fraction = bin - lowerBin;
      const db = freqData[lowerBin] * (1 - fraction) + freqData[upperBin] * fraction;
      score += db;
      if (db >= -75) hasSignal = true;
    }

    const index = scores.length;
    if (!hasSignal) {
      scores.push(-Infinity);
      continue;
    }

    // 前フレームのRPMがある場合は連続性を優遇
    if (smoothedRpm > 700) {
      const diffRatio = Math.abs(rpm - smoothedRpm) / smoothedRpm;
      if (diffRatio < 0.25) {
        score += 12 * (1 - diffRatio / 0.25);
      }
    }

    scores.push(score);
    if (score > bestScore) {
      bestScore = score;
      bestIndex = index;
    }
  }

  if (bestIndex === -1) {
    smoothedRpm *= 0.92;
    return { rpm: Math.round(smoothedRpm), hz: 0 };
  }

  // 隣接候補のスコアを放物線補間して10rpm刻みの段差を抑える
  let offset = 0;
  if (bestIndex > 0 && bestIndex < scores.length - 1) {
    const left = scores[bestIndex - 1];
    const center = scores[bestIndex];
    const right = scores[bestIndex + 1];
    const denom = left - 2 * center + right;
    if (Number.isFinite(left) && Number.isFinite(right) && denom < 0) {
      offset = Math.max(-1, Math.min(1, 0.5 * (left - right) / denom));
    }
  }
  const rawRpm = minRpm + (bestIndex + offset) * rpmStep;

  smoothedRpm = smoothedRpm === 0 ? rawRpm : smoothedRpm * 0.65 + rawRpm * 0.35;
  return { rpm: Math.round(smoothedRpm), hz: (rawRpm / hzToRpm).toFixed(1) };
}

// === メインループ ===
function mainLoop() {
  if (!isRunning) return;

  // 1. 車速取得（テストモード優先、実車時はGPS）
  const useSim = document.getElementById('chkSimSpeed').checked;
  if (useSim) {
    currentSpeedKmh = parseFloat(document.getElementById('sliderSpeed').value);
    document.getElementById('speedSource').textContent = 'km/h (SIM)';
  } else {
    currentSpeedKmh = gpsSpeedKmh;
    document.getElementById('speedSource').textContent = 'km/h (GPS)';
  }

  // 2. エンジン回転数取得
  const { rpm, hz } = detectEngineRpm();

  // 3. ギアポジション推定ステートマシン
  const ratios = currentProfile.gearRatios;
  let currentRatio = currentSpeedKmh >= 10 ? (rpm / currentSpeedKmh) : 0;
  let matchedGear = null;

  if (currentSpeedKmh >= 10 && rpm >= 800) {
    let minErr = Infinity;
    ratios.forEach((r, idx) => {
      const err = Math.abs(currentRatio - r) / r;
      if (err < minErr) {
        minErr = err;
        if (err < 0.065) { // 誤差6.5%以内ならギア噛み合いとみなす
          matchedGear = idx + 1;
        }
      }
    });
  }

  if (matchedGear !== null) {
    // 同じギア判定が数フレーム続いたら確定
    if (candidateGear === matchedGear) {
      gearStableFrames++;
    } else {
      candidateGear = matchedGear;
      gearStableFrames = 1;
    }

    if (gearStableFrames >= 4) {
      engagedGear = matchedGear;
      referenceGear = matchedGear;
      isClutchOpen = false;
      targetHitTriggered = false;
    }
  } else {
    // 比率が外れた＝クラッチ切断またはニュートラル
    if (currentSpeedKmh >= 10 && engagedGear !== null) {
      isClutchOpen = true;
    }
    engagedGear = null;
    gearStableFrames = 0;
  }

  // 4. 目標回転数（1段落とし・2段落とし）の計算
  const activeGear = referenceGear;
  let t1Rpm = null, t2Rpm = null;

  if (activeGear && currentSpeedKmh >= 10) {
    if (activeGear - 1 >= 1) {
      t1Rpm = Math.round(currentSpeedKmh * ratios[activeGear - 2]);
    }
    if (activeGear - 2 >= 1) {
      t2Rpm = Math.round(currentSpeedKmh * ratios[activeGear - 3]);
    }
  }

  // 5. UI更新
  updateUI(rpm, hz, currentRatio, t1Rpm, t2Rpm);

  requestAnimationFrame(mainLoop);
}

function updateUI(rpm, hz, ratio, t1Rpm, t2Rpm) {
  document.getElementById('dispSpeed').textContent = Math.round(currentSpeedKmh);
  document.getElementById('dispRpm').textContent = `${rpm.toLocaleString('ja-JP')} RPM`;
  document.getElementById('debugInfo').textContent = `Ignition: ${hz} Hz | N/V Ratio: ${ratio.toFixed(2)}`;
  setNeedle('speedNeedle', currentSpeedKmh, MAX_SPEED_KMH);
  setNeedle('tachNeedle', rpm, MAX_RPM);
  updateTargetMarker('targetStep1', t1Rpm, 1);
  updateTargetMarker('targetStep2', t2Rpm, 2);

  const revMatched = isClutchOpen && t1Rpm && Math.abs(rpm - t1Rpm) <= 120;
  document.getElementById('tachNeedle').style.stroke = revMatched
    ? 'var(--green)'
    : rpm >= currentProfile.redline - 300 ? 'var(--red)' : '';
  if (revMatched && !targetHitTriggered) {
    playTargetBeep();
    targetHitTriggered = true;
  } else if (!revMatched && (!t1Rpm || Math.abs(rpm - t1Rpm) > 250)) {
    targetHitTriggered = false;
  }

  const gearEl = document.getElementById('dispGear');
  const statusEl = document.getElementById('dispGearStatus');

  if (engagedGear) {
    gearEl.textContent = engagedGear;
    statusEl.textContent = 'ENGAGED';
    statusEl.style.fill = 'var(--green)';
  } else if (isClutchOpen && referenceGear) {
    gearEl.textContent = `${referenceGear}→?`;
    statusEl.textContent = 'CLUTCH / BLIPPING';
    statusEl.style.fill = 'var(--amber)';
  } else {
    gearEl.textContent = 'N';
    statusEl.textContent = currentSpeedKmh < 10 ? 'LOW SPEED' : 'NEUTRAL';
    statusEl.style.fill = 'var(--text-dim)';
  }
  document.getElementById('speedSource').textContent = `KM/H · ${document.getElementById('chkSimSpeed').checked ? 'SIM' : 'GPS'}`;
}

function setNeedle(id, value, max) {
  const angle = (135 + Math.min(max, Math.max(0, value)) / max * 270) * Math.PI / 180;
  const needle = document.getElementById(id);
  needle.setAttribute('x2', DIAL_CENTER_X + Math.cos(angle) * 105);
  needle.setAttribute('y2', DIAL_CENTER_Y + Math.sin(angle) * 105);
  const tail = document.getElementById(`${id}Tail`);
  tail.setAttribute('x2', DIAL_CENTER_X - Math.cos(angle) * 26);
  tail.setAttribute('y2', DIAL_CENTER_Y - Math.sin(angle) * 26);
}

function updateTargetMarker(id, targetRpm, stepNum) {
  const group = document.getElementById(id);
  if (!targetRpm) {
    group.style.visibility = 'hidden';
    return;
  }
  const angle = (135 + Math.min(MAX_RPM, targetRpm) / MAX_RPM * 270) * Math.PI / 180;
  const line = group.querySelector('line');
  line.setAttribute('x1', DIAL_CENTER_X + Math.cos(angle) * 121);
  line.setAttribute('y1', DIAL_CENTER_Y + Math.sin(angle) * 121);
  line.setAttribute('x2', DIAL_CENTER_X + Math.cos(angle) * 140);
  line.setAttribute('y2', DIAL_CENTER_Y + Math.sin(angle) * 140);

  const label = group.querySelector('text');
  label.setAttribute('x', DIAL_CENTER_X + Math.cos(angle) * 83);
  label.setAttribute('y', DIAL_CENTER_Y + Math.sin(angle) * 83);
  label.textContent = `${stepNum}↓ ${Math.round(targetRpm).toLocaleString('ja-JP')}`;
  const colorClass = targetRpm > currentProfile.redline
    ? 'target-overrev'
    : stepNum === 1 ? 'target-step1' : 'target-step2';
  line.setAttribute('class', `target-mark ${colorClass}`);
  label.setAttribute('class', `target-label ${colorClass}`);
  group.style.visibility = 'visible';
}
</script>
</body>
